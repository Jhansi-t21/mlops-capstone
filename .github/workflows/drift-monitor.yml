# Scheduled data-drift check with Evidently AI.
# Runs every Monday 06:00 UTC and can also be started by hand (Actions tab -> Run workflow).
# In a real deployment you would point --current at logs collected from the live API.
name: drift-monitor

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      scenario:
        description: "none = healthy data, drift = artificially shifted data"
        default: "none"
        type: choice
        options: ["none", "drift"]

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild reference data
        run: dvc repro collect preprocess
      - name: Run drift report
        run: python -m src.monitor --simulate "${{ github.event.inputs.scenario || 'none' }}"
      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            monitoring/reports/latest_drift_report.html
            monitoring/reports/drift_summary.json
